name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Grant execute permission for gradlew
      run: |
        # 先检查文件是否存在
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          echo "gradlew 权限设置成功"
        elif [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          echo "./gradlew 权限设置成功"
        else
          echo "使用 gradle 命令（不使用 wrapper）"
        fi

    - name: Build with Gradle
      run: |
        # 尝试使用 gradlew，如果不存在则使用系统 gradle
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi
      env:
        JAVA_OPTS: '-Xmx2048m'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 5
