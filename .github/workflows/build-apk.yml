name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Create gradlew script
      run: |
        # 创建 gradlew 脚本
        echo '#!/bin/bash' > gradlew
        echo 'GRADLE_HOME=$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar' >> gradlew
        echo 'exec java -jar "$GRADLE_HOME" "$@"' >> gradlew
        chmod +x gradlew

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Build APK
      run: ./gradlew assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: app/build/outputs/apk/debug/*.apk
