name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Check if gradlew exists
      run: |
        ls -la
        if [ -f "gradlew" ]; then
          echo "gradlew exists"
        else
          echo "gradlew does not exist"
        fi

    - name: Make gradlew executable (if exists)
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          echo "gradlew made executable"
        else
          echo "gradlew not found, attempting to fix..."
          # Generate gradlew using sdkman or by downloading it
          wget https://raw.githubusercontent.com/gradle/gradle/master/gradlew
          chmod +x gradlew
        fi

    - name: Build with Gradle Wrapper
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew tasks --all
          ./gradlew assembleDebug --no-daemon
        else
          echo "gradlew still not available"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK
        path: app/build/outputs/apk/debug/app-debug.apk
