name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Gradle 8.0
      run: |
        # 安装 Gradle 8.0
        wget https://services.gradle.org/distributions/gradle-8.0-all.zip
        sudo unzip -d /opt/gradle gradle-8.0-all.zip
        echo "GRADLE_HOME=/opt/gradle/gradle-8.0" >> $GITHUB_ENV
        echo "/opt/gradle/gradle-8.0/bin" >> $GITHUB_PATH
        gradle --version

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 33
        build-tools-version: 33.0.2
        cmake-version: 3.22.1

    - name: Build APK
      run: |
        # 使用 Gradle 8.0
        gradle clean
        gradle assembleDebug
      env:
        JAVA_OPTS: '-Xmx4096m'
        GRADLE_OPTS: '-Dorg.gradle.daemon=false'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 5
