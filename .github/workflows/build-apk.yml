name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Generate gradlew for Linux
      run: |
        echo "检测到 gradlew.bat 但没有 gradlew，为 Linux 环境生成 gradlew 脚本"
        # 生成 gradlew 文件
        cat > gradlew << 'EOF'
        #!/bin/bash
        # 这是一个简化的 gradlew 包装器脚本
        GRADLE_HOME=$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar
        java -jar "$GRADLE_HOME" "$@"
        EOF
        
        # 设置为可执行
        chmod +x gradlew
        echo "已创建 gradlew 脚本"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 33
        build-tools-version: 33.0.2
        ndk-version: 25.1.8937393
        cmake-version: 3.22.1

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build APK
      run: |
        # 检查 gradle-wrapper.properties 中的 Gradle 版本
        if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          echo "检测到 Gradle wrapper 配置文件"
          GRADLE_VERSION=$(grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties | grep -o "gradle-[0-9]\+\.[0-9]\+")
          echo "Gradle 版本: $GRADLE_VERSION"
        fi
        
        # 清理并构建
        ./gradlew clean
        
        # 使用 --warning-mode none 避免警告导致失败
        ./gradlew assembleDebug --no-daemon --warning-mode none --stacktrace
        
        # 检查构建结果
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✅ APK 构建成功！"
          ls -la app/build/outputs/apk/debug/
        else
          echo "❌ APK 构建失败，检查文件："
          find . -name "*.apk" -type f
        fi
      env:
        JAVA_OPTS: '-Xmx4096m'
        GRADLE_OPTS: '-Dorg.gradle.daemon=false'

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/output-metadata.json
        retention-days: 5
